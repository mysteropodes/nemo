[package]
name = "nemo"
version = "0.5.0"
description = "2D frame-by-frame vector animation with auto inbetweening"
authors = ["Cyril"]
edition = "2021"
# Machine-readable declaration of THIS crate\'s own license, so `cargo license`
# and any downstream tooling report Nemo correctly instead of "N/A".
license = "GPL-3.0-or-later"

[lib]
# Renamed from strokemotion/strokemotion_lib (2026-07, rebrand) — this is
# what actually shows in Activity Monitor / `ps aux` / crash reports, unlike
# tauri.conf.json's productName ("Nemo", already renamed) which only
# controls the .app bundle's display name. `identifier`
# ("com.strokemotion.app") and the strokemotion-updates/strokemotion-feedback
# GitHub repo names are deliberately NOT touched here — those are real
# external resources (repo names, macOS bundle identity tied to
# auto-update continuity for existing installs), a separate decision from
# this cosmetic binary-name fix.
name = "nemo_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-http = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Live Google Fonts (fetch_google_font, lib.rs) — encodes a fetched TTF's
# raw bytes to base64 for the trip back to JS, same shape as the existing
# feedback-attachment content_base64 convention.
base64 = "0.22"
# Native video decode (src/video_decode.rs): feeds decoded RGBA8 frames to
# the webview for engine.register_image() (the same GPU-texture entry
# point static images already use, geometry-wasm/src/engine.rs). Decodes
# via a PIPED ffmpeg CLI subprocess (std::process::Command against the
# already-bundled `externalBin` sidecar) — NO ffmpeg crate dependency here
# on purpose: the previous `video-rs` (ffmpeg-sys-next) approach linked
# libavcodec/etc directly, requiring ~91 Homebrew dylibs bundled into every
# build and dynamically linking GPL-licensed code into this binary. See
# video_decode.rs's own module doc comment for the full rationale.

# Image vectorization (2026-09, src/vectorize.rs) — the vtracer pipeline
# itself lives in ../vectorize-core (shared with vectorize-wasm/, see that
# crate's own doc comment for why); this crate only needs it for the thin
# Tauri-command wrapper.
vectorize-core = { path = "../vectorize-core" }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
block = "0.1"

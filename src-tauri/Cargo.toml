[package]
name = "nemo"
version = "0.5.0"
description = "2D frame-by-frame vector animation with auto inbetweening"
authors = ["Cyril"]
edition = "2021"

[lib]
# Renamed from strokemotion/strokemotion_lib (2026-07, rebrand) — this is
# what actually shows in Activity Monitor / `ps aux` / crash reports, unlike
# tauri.conf.json's productName ("Nemo", already renamed) which only
# controls the .app bundle's display name. `identifier`
# ("com.strokemotion.app") and the strokemotion-updates/strokemotion-feedback
# GitHub repo names are deliberately NOT touched here — those are real
# external resources (repo names, macOS bundle identity tied to
# auto-update continuity for existing installs), a separate decision from
# this cosmetic binary-name fix.
name = "nemo_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-http = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# EXPERIMENTAL (2026-07, experimental/native-video-decode branch — NOT for
# main/motion-mode-v1): native Rust video decode, feeding decoded RGBA8
# frames to the webview for engine.register_image() (the same GPU-texture
# entry point static images already use, geometry-wasm/src/engine.rs).
# video-rs wraps ffmpeg-sys-next/ffmpeg's C libraries — this DYNAMICALLY
# LINKS against libavcodec/libavformat/etc via pkg-config at build time
# (confirmed present locally: `pkg-config --modversion libavcodec` ->
# 62.11.100, Homebrew). Distribution is UNSOLVED: the app currently only
# bundles the ffmpeg CLI binary (externalBin), not the shared libraries
# other programs can link against, and several of ffmpeg's optional
# codecs (x264/x265) are GPL — real licensing question for a commercial
# build, deliberately not addressed on this experimental branch yet.
video-rs = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
block = "0.1"

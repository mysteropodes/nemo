[package]
name = "nemo-xfl-import"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Standalone, pure reader for Adobe Animate .fla (XFL, CS5+) files (#2020, post-remediation prototype; not wired into the app)"

[dependencies]
# Both versions are already locked in src-tauri/Cargo.lock (MIT licensed).
quick-xml = { version = "=0.39.4", default-features = false }
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
# Already in the lock through zip (same backend); used for lossless bitmap .dat entries.
flate2 = { version = "=1.1.11", default-features = false, features = ["zlib-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "nemo-mcp"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Bundled MCP transport for Nemo application services"

[dependencies]
rmcp = { version = "=3.2.0", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
# The standalone stdio binary parses object-valued reproduction requests itself.
serde_json = { version = "1", features = ["float_roundtrip"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"

[dev-dependencies]
tempfile = "3"
rmcp = { version = "=3.2.0", features = ["client", "transport-child-process"] }
jsonschema = { version = "=0.56.0", default-features = false }

[[bin]]
name = "nemo-mcp-schema"
path = "src/schema.rs"

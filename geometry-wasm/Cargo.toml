[package]
name = "geometry-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
geo-types = "0.6"
geo-booleanop = "0.3"
# tiny-skia was the Phase C1 proof-of-concept rasterizer (CPU/software).
# Swapped for vello (GPU compute via WebGPU/wgpu) per explicit direction —
# faster and the geometry primitives (kurbo/peniko) are the intended long-
# term base for the scene graph anyway. Real tradeoff accepted knowingly:
# WebGPU support in Tauri's system WKWebView is recent and not guaranteed on
# older macOS — needs verifying in the actual shipped app, not just the
# (Chromium-based, WebGPU-enabled-by-default) browser preview used to test.
# Pinned to a recent release deliberately: vello 0.3's wgpu 22 sent a
# requestDevice() limits dict with a field name ("maxInterStageShaderComponents")
# this browser's current WebGPU implementation no longer recognizes —
# spec/version drift between wgpu 22 (mid-2024) and a much newer browser.
# 0.9 (wgpu 29) matches the current spec cleanly.
vello = "0.9"
# vello reports abnormal render conditions (image-atlas actions, coarse-
# buffer overflow warnings like render.rs's "Trying to paint too large
# image") only through the `log` crate — without a logger they vanish
# silently, which made the 2026-07 "texture bitmap disparaît" hunt blind.
# console_log routes them to the browser console (Warn level in
# create_engine; bump to Debug locally for per-frame atlas tracing).
log = "0.4"
console_log = "1"
# Rust panics inside a wasm-bindgen module otherwise surface to JS as a
# bare "RuntimeError: unreachable" with zero information about WHERE or
# WHY (release profile compiles panic=abort down to the unreachable
# instruction for code size) — this hook routes the real panic message
# (file/line/reason) to console.error instead, the standard fix for
# exactly this opacity. Added 2026-08 chasing a silent erase_at_point
# panic that left `renderNow` throwing "unreachable" on every subsequent
# call with no way to tell what had actually broken.
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"
# Tiny oneshot channel used to await wgpu's callback-style buffer map_async
# from an async wasm export (GPU->CPU pixel readback for the export pipeline).
futures-channel = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }

[dev-dependencies]
naga = { version = "29.0.4", features = ["wgsl-in"] }
# Native (non-wasm32) diagnostic test only (feedback #104 dab-render-drop
# repro, tests/dab_dense_overlap_repro.rs) — blocks on the async wgpu
# device/adapter negotiation and buffer readback outside a browser event
# loop. Never touches the wasm32 release build (dev-dependency only).
pollster = "0.3"
# Diagnostic-only feature flip on vello: exposes Scene::bump_estimate(), a
# CPU-side estimate of GPU bump-allocator demand for a built scene, purely
# for the feedback #104 repro test to compare against vello's fixed,
# hand-picked buffer sizes (vello_encoding::config::BufferSizes::new) —
# never consulted by render_to_texture itself (checked: not referenced
# anywhere in vello's render.rs/config.rs), so this does NOT change
# render() or render_to_pixels() behavior, only adds a diagnostic method
# available to `cargo test`. Cargo unifies dev-dependency features into the
# `cargo test` build only — the wasm32 release build (wasm-pack build,
# which never touches dev-dependencies) is unaffected.
vello = { version = "0.9", features = ["bump_estimate"] }

[profile.release]
opt-level = "s"
lto = true

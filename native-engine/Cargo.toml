[package]
name = "nemo-native-engine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Disabled scaffold for the admitted native opacity slice"
autotests = false

[features]
default = []
codec = ["dep:serde", "dep:serde_json"]
reference_image_asset = ["dep:png", "dep:flate2", "dep:miniz_oxide"]
project_media_codec = ["codec", "reference_image_asset", "dep:base64"]
font_asset_admission = ["project_media_codec", "dep:read-fonts"]
font_asset_wire = ["font_asset_admission"]
commands = ["codec"]
history = ["commands"]
evaluation = ["commands", "dep:libm"]
scheduler = ["evaluation"]
compositor = ["scheduler", "dep:vello", "dep:wgpu", "dep:pollster"]
viewport = ["compositor", "dep:raw-window-handle"]
export_job = ["history", "compositor", "dep:png"]
application = ["history", "export_job"]
object_expression_pin = ["history", "evaluation"]
object_expression_runtime = ["object_expression_pin", "dep:rquickjs"]
# Test harness selectors are separate from production module availability.
test-codec = ["project_media_codec"]
test-commands = ["commands"]
test-history = ["history"]
test-evaluation = ["evaluation"]
test-scheduler = ["scheduler"]
test-compositor = ["compositor"]
test-viewport = ["viewport"]
test-export_job = ["export_job"]
test-application = ["application", "project_media_codec"]
test-object_expression_pin = ["object_expression_pin"]
test-object_expression_runtime = ["object_expression_runtime"]

[dependencies]
# #2130: portable trig for Paper-compatible rotation; already pinned transitively.
libm = { version = "=0.2.16", default-features = false, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
# Reproduction's object export must preserve adjacent f64 command values.
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"], optional = true }
vello = { version = "0.9.0", optional = true }
wgpu = { version = "29.0.4", optional = true }
pollster = { version = "0.4.0", optional = true }
raw-window-handle = { version = "0.6.2", optional = true }
png = { version = "0.18", optional = true }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"], optional = true }
miniz_oxide = { version = "=0.9.1", default-features = false, optional = true }
base64 = { version = "=0.22.1", optional = true }
read-fonts = { version = "=0.39.2", optional = true }
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"], optional = true }
# L02-I (#2108): the polygon boolean / eraser engine of the native boolean join. MIT OR Apache-2.0,
# edition 2024 / rust-version 1.88; the rayon feature stays off (single-threaded, deterministic).
i_overlay = { version = "=9.0.0", default-features = false }
# T10: retained fill geometry, independent of compositor/WASM feature availability.
kurbo = "=0.13.1"

[[test]]
name = "codec"
path = "src/lib.rs"
required-features = ["test-codec"]

[[test]]
name = "commands"
path = "src/lib.rs"
required-features = ["test-commands"]

[[test]]
name = "history"
path = "src/lib.rs"
required-features = ["test-history"]

[[test]]
name = "evaluation"
path = "src/lib.rs"
required-features = ["test-evaluation"]

[[test]]
name = "scheduler"
path = "src/lib.rs"
required-features = ["test-scheduler"]

[[test]]
name = "compositor"
path = "src/lib.rs"
required-features = ["test-compositor"]

[[test]]
name = "viewport"
path = "src/lib.rs"
required-features = ["test-viewport"]

[[test]]
name = "export_job"
path = "src/lib.rs"
required-features = ["test-export_job"]

[[test]]
name = "application"
path = "src/lib.rs"
required-features = ["test-application"]

[[test]]
name = "object_expression_pin"
path = "src/lib.rs"
required-features = ["test-object_expression_pin"]

[[test]]
name = "object_expression_runtime"
path = "src/lib.rs"
required-features = ["test-object_expression_runtime"]

# E2 (#2088): unmodified upstream rquickjs-sys 0.14.0 plus the two-file
# QuickJS single-function parser patch; see
# third_party/rquickjs-sys-0.14.0.PROVENANCE.md. Same version, no bump.
[patch.crates-io]
rquickjs-sys = { path = "third_party/rquickjs-sys-0.14.0" }

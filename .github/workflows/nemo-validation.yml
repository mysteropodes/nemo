name: Nemo validation

on:
  workflow_dispatch:
    inputs:
      allow_hosted_build:
        description: 'Explicitly approve this requested GitHub-hosted run (builds normally run locally)'
        type: boolean
        required: true
        default: false
      base_sha:
        description: 'Full 40-character reviewed main/base SHA to compare against the selected ref'
        type: string
        required: true

# Local checks are the default. Hosted runs require an explicit human request.
# Untrusted candidate code runs only on disposable GitHub-hosted runners.
permissions:
  contents: read

concurrency:
  group: nemo-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  NEMO_CI_BASE_SHA: ${{ inputs.base_sha }}

jobs:
  quick:
    name: Nemo / local quick
    if: github.event_name == 'workflow_dispatch' && inputs.allow_hosted_build == true
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/nemo/ci.cjs quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nemo-quick-receipts
          path: reports/
          if-no-files-found: error

  boundaries:
    name: Nemo / boundaries
    if: github.event_name == 'workflow_dispatch' && inputs.allow_hosted_build == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/nemo/ci.cjs boundaries
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nemo-boundary-receipts
          path: reports/ci/
          if-no-files-found: error

  surfaces:
    name: Nemo / affected surfaces
    if: github.event_name == 'workflow_dispatch' && inputs.allow_hosted_build == true
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/nemo/ci.cjs surfaces
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nemo-surface-receipts
          path: reports/
          if-no-files-found: error

  aggregate:
    name: Nemo / required
    if: always() && github.event_name == 'workflow_dispatch' && inputs.allow_hosted_build == true
    needs: [quick, boundaries, surfaces]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/nemo/ci.cjs aggregate
        env:
          NEMO_CI_NEEDS: ${{ toJSON(needs) }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nemo-aggregate-receipt
          path: reports/ci/
          if-no-files-found: error
